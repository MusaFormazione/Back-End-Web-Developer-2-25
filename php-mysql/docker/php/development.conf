ServerName localhost

<Directory /var/www/html>
    Options +Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php index.html
    IndexIgnore .??* docker compose.yaml README.md
</Directory>

<Directory /var/www/html/docker>
    Require all denied
</Directory>

<FilesMatch "^(\..*|compose\.ya?ml|docker-compose\.ya?ml|Dockerfile)$">
    Require all denied
</FilesMatch>
