display_errors = On
error_reporting = E_ALL

; "mode" decide COSA fa Xdebug. I modi principali sono:
; - debug   -> abilita il debug passo-passo con breakpoint (quello che serve di solito)
; - develop -> messaggi di errore più dettagliati in browser (stack trace migliori)
xdebug.mode = debug,develop
; "start_with_request" dice A QUANDO Xdebug prova a connettersi all'IDE.
; yes = tenta la connessione ad ogni richiesta (comodo in sviluppo,
; ma leggermente più lento: da usare solo in ambienti locali)
xdebug.start_with_request = yes
; Host a cui Xdebug deve connettersi per parlare con l'IDE (es. VS Code, PhpStorm).
; "host.docker.internal" è un indirizzo speciale che, dentro un container Docker,
; punta al computer che ospita Docker stesso (dove gira il tuo editor)
xdebug.client_host = host.docker.internal
; Porta su cui l'IDE resta in ascolto per accettare la connessione di Xdebug.
; 9003 è la porta di default usata da Xdebug 3 (e da VS Code/PhpStorm)
xdebug.client_port = 9003
