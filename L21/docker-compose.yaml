services:
  php:
    image: php:8.4-apache
    container_name: basi-mysql-php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: basi-mysql-db
    restart: unless-stopped
    command: --mysql-native-password=ON 
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: basi_mysql
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
