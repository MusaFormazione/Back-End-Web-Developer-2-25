services:
  php:
    build:
      context: .
      dockerfile_inline: |
        FROM php:8.3-apache
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git unzip \
            && rm -rf /var/lib/apt/lists/*
        COPY --from=composer:2 /usr/bin/composer /usr/local/bin/composer
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
